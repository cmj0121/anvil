name: Release

on:
  push:
    tags: ["v*"]

# A called workflow can only narrow these, so ci.yml keeps its read access.
permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: anvil-*
          path: dist
          merge-multiple: true
      - name: Check the archives
        run: |
          ls -l dist
          archives=$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)
          sums=$(find dist -maxdepth 1 -name '*.tar.gz.sha256' | wc -l)
          if [ "$archives" -ne 3 ] || [ "$sums" -ne 3 ]; then
            echo "::error::expected 3 archives and 3 checksums in dist/, found $archives and $sums"
            exit 1
          fi
      # A re-run re-uploads the assets to the release the first run created.
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            exit 0
          fi
          set -- --generate-notes --verify-tag
          case "$GITHUB_REF_NAME" in *-*) set -- "$@" --prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* "$@"
