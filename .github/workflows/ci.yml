name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  SOPS_VERSION: v3.13.3
  SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A v* tag must match Cargo.toml and point at a commit on main; any other ref gets <cargo version>-<short sha>.
      - id: version
        run: |
          cargo_version=$(sed -n '/^\[package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          if [ -z "$cargo_version" ]; then echo "::error::no [package] version in Cargo.toml"; exit 1; fi
          case "$GITHUB_REF" in
            refs/tags/v*)
              version=${GITHUB_REF#refs/tags/}
              if [ "$version" != "v$cargo_version" ]; then
                echo "::error::tag $version does not match Cargo.toml version $cargo_version"
                exit 1
              fi
              if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                echo "::error::tag $version points at $GITHUB_SHA, which is not on main"
                exit 1
              fi
              # Without both keys compiled in, anvil update could never install this release.
              for key in keys/minisign.pub keys/minisign-next.pub; do
                if [ ! -s "$key" ]; then
                  echo "::error::$key is missing; a release without both public keys cannot be updated by anvil update"
                  exit 1
                fi
              done
              ;;
            *)
              version="$cargo_version-$(printf %.7s "$GITHUB_SHA")"
              ;;
          esac
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "version: $version"

  lint:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    name: make test (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The terminal tests need os.login_tty (3.11+); the sops tests need sops on PATH.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install sops
        run: sh .github/install-sops.sh
      - run: make test
      - name: Build without the tui feature
        run: cargo build --no-default-features

  msrv:
    name: MSRV (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --all-targets

  e2e:
    name: make e2e
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install sops
        run: sh .github/install-sops.sh
      # e2e.sh exits 0 with "skip" when docker is missing; in CI that is a failure.
      - name: Run the e2e suite
        run: |
          make e2e 2>&1 | tee e2e.log
          code=$?
          if grep -qx skip e2e.log; then echo "::error::e2e skipped: docker unavailable"; exit 1; fi
          exit $code
        shell: bash -o pipefail {0}

  build:
    name: build (${{ matrix.target }})
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # Release binaries are built from scratch, never from a restored cache.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target "$TARGET"
      # The x86_64 macOS binary runs under Rosetta on arm64 runners; without it, skip that leg, but fail on a tag.
      - name: Smoke test
        run: |
          bin="target/$TARGET/release/anvil"
          if [ "$TARGET" = x86_64-apple-darwin ] && [ "$(uname -m)" = arm64 ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            case "$GITHUB_REF" in
              refs/tags/*)
                echo "::error::Rosetta unavailable; cannot smoke-test the $TARGET release binary"
                exit 1
                ;;
            esac
            echo "::notice::Rosetta unavailable; skipping the $TARGET smoke test"
            exit 0
          fi
          "$bin" --version
          # The debug-only test flags must not exist in a release build: clap rejects them with exit 2.
          for flag in --release-key --release-url; do
            code=0
            "$bin" "$flag" x update --check || code=$?
            if [ "$code" -ne 2 ]; then
              echo "::error::$bin $flag x update --check exited $code, not 2; debug-only flags are in the release build"
              exit 1
            fi
          done
      - run: sh .github/package.sh "$TARGET" "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anvil-${{ matrix.target }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error
