[package]
name = "anvil"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Setup your env, both for human and agent, in one command."

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = "1"
log = "0.4"
rustix = { version = "1", features = ["fs", "process"] }
serde-saphyr = { version = "2", default-features = false, features = ["serialize", "deserialize"] }
zeroize = { version = "1", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[profile.release]
lto = true
