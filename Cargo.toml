[package]
name = "anvil"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Setup your env, both for human and agent, in one command."
license = "GPL-3.0-or-later"

[lib]
name = "anvil"
path = "src/lib.rs"
doc = false

[workspace]
members = [".", "plugins/anvil-audit"]
# cargo build, run and install touch only anvil; make audit-plugin builds the plugin.
default-members = ["."]

[workspace.lints.clippy]
match_bool = "warn"
redundant_closure_for_method_calls = "warn"

[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
log = "0.4"
rustix = { version = "1", features = ["fs", "process", "termios"] }
serde-saphyr = { version = "2", default-features = false, features = ["serialize", "deserialize"] }
zeroize = { version = "1", features = ["serde"] }
age = { version = "0.12", default-features = false, features = ["armor"] }
# unstable-rendered-line-info: Paragraph::line_count, for the TUI's scroll-to-step;
# recheck on a ratatui 0.31 bump.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"], optional = true }
crossterm = { version = "0.29.0", default-features = false, features = ["events"], optional = true }
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
minisign-verify = "0.3"
toml_edit = "0.25"
# builtins: the pure filters and tests (default, is defined); fuel: the step limit.
# No loader, multi_template or debug.
minijinja = { version = "3", default-features = false, features = ["builtins", "fuel"] }

[dev-dependencies]
anvil = { path = ".", features = ["test-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[profile.release]
lto = true

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]
test-util = []
