[package]
name = "anvil"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Setup your env, both for human and agent, in one command."

[workspace]
members = [".", "plugins/anvil-audit"]
# cargo build, run and install touch only anvil; make audit-plugin builds the plugin.
default-members = ["."]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
serde_json = "1"
sha2 = "0.10"
log = "0.4"
rustix = { version = "1", features = ["fs", "process", "termios"] }
serde-saphyr = { version = "2", default-features = false, features = ["serialize", "deserialize"] }
zeroize = { version = "1", features = ["serde"] }
age = { version = "0.12", default-features = false, features = ["armor"] }
# unstable-rendered-line-info: Paragraph::line_count, for the TUI's scroll-to-step;
# recheck on a ratatui 0.31 bump.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"], optional = true }
crossterm = { version = "0.29.0", default-features = false, features = ["events"], optional = true }
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
minisign-verify = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[profile.release]
lto = true

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]
