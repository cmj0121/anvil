packages:
  install:
    - git
    - vim
    - htop
  pin:
    - vim # installed when missing, skipped by the upgrade; pacman and dnf only
  remove:
    - nano # removed after the install when it is installed
  upgrade: true # upgrade every installed package first
# Created with its missing parent /etc/app, and kept root:wheel 0750 so only
# root and the admins in wheel (a group Arch ships) can open it.
dirs:
  - path: /etc/app/conf.d
    mode: "0750"
    owner: root
    group: wheel
    parents: true
    tags:
      - linode
# Root-owned file under /etc, written through sudo on hosts tagged linode.
files:
  - src: files/motd
    dest: /etc/motd
    mode: "0644"
    tags:
      - linode
    notify:
      - log motd change # only when the bytes change
  # Readable by wheel, not by others; a changed owner, group or mode is fixed in place.
  - src: files/app.conf
    dest: /etc/app/conf.d/app.conf
    mode: "0640"
    owner: root
    group: wheel
    tags:
      - linode
    notify:
      - log app config change # also when only the owner, group or mode is fixed
services:
  - name: sshd
    state: started
    enabled: true
    tags:
      - linode
steps:
  - run: uptime
  # Guards make a run step safe to repeat. This one runs on the first apply only.
  - run: date -u > /var/tmp/anvil-provisioned
    creates: /var/tmp/anvil-provisioned
  # Skipped while the note already holds this line.
  - run: echo 'managed by anvil' > /var/tmp/anvil-note
    unless: grep -qx 'managed by anvil' /var/tmp/anvil-note
# Runs once, after the target's last step, when the motd file above changed.
handlers:
  - name: log motd change
    run: logger -t anvil 'motd updated'
  - name: log app config change
    run: logger -t anvil 'app config updated'
